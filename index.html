<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, doc, setDoc, onSnapshot, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCf95RNXb_Nu659KJljVxXbL7Fk9VN8HjI",
    authDomain: "tracker-jobs.firebaseapp.com",
    projectId: "tracker-jobs",
    storageBucket: "tracker-jobs.firebasestorage.app",
    messagingSenderId: "307964371204",
    appId: "1:307964371204:web:8bbafe52bf54c895403051"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const DOC = doc(db, 'tracker', 'data');

  const PK = 'designJobs.pipeline.v1';
  const SK = 'designJobs.status.v1';

  let syncing = false;

  // Загружаем данные из Firebase при старте
  getDoc(DOC).then(snap => {
    if (snap.exists()) {
      const remote = snap.data();
      // Мержим: удалённые данные приоритетнее если они новее
      if (remote.pipeline) localStorage.setItem(PK, JSON.stringify(remote.pipeline));
      if (remote.status)   localStorage.setItem(SK, JSON.stringify(remote.status));
    }
    if (typeof window.renderTracker === 'function') window.renderTracker();
  }).catch(() => {});

  // Слушаем изменения из Firebase (синк с другого устройства)
  onSnapshot(DOC, snap => {
    if (!snap.exists() || syncing) return;
    const remote = snap.data();
    if (remote.pipeline) localStorage.setItem(PK, JSON.stringify(remote.pipeline));
    if (remote.status)   localStorage.setItem(SK, JSON.stringify(remote.status));
    if (typeof window.renderTracker === 'function') window.renderTracker();
  });

  // Сохраняем в Firebase при каждом изменении localStorage
  function pushToFirebase() {
    syncing = true;
    const pipeline = JSON.parse(localStorage.getItem(PK) || '{}');
    const status   = JSON.parse(localStorage.getItem(SK)  || '{}');
    setDoc(DOC, { pipeline, status, updatedAt: Date.now() })
      .catch(() => {})
      .finally(() => { syncing = false; });
  }

  // Перехватываем изменения localStorage
  const _setItem = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function(key, value) {
    _setItem(key, value);
    if (key === PK || key === SK) pushToFirebase();
  };

  window.__firebasePush = pushToFirebase;
</script>

<style>
:root { color-scheme: light; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  background: #f5f5f7; color: #1a1a1a;
  margin: 0; padding: 0 0 60px;
  font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* ===== HEADER ===== */
.pl-header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 20px 12px;
  background: #fff;
  border-bottom: 1px solid #e5e5ea;
  position: sticky; top: 0; z-index: 100;
}
.pl-title { font-size: 20px; font-weight: 800; flex: 1; letter-spacing: -0.3px; }
.count-badge {
  background: #f0f0f4; color: #6e6e73; font-size: 12px;
  padding: 3px 10px; border-radius: 999px; white-space: nowrap;
}

/* ===== CHARTS AREA ===== */
.stat-cards { padding: 16px 20px; }
.charts-wrap {
  display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
  justify-content: center;
}
.chart-donut-section { display: flex; align-items: center; gap: 22px; flex-shrink: 0; }
.donut-container { position: relative; width: 190px; height: 190px; flex-shrink: 0; }
#donutChart { display: block; }
.donut-center-label {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
}
.donut-num { font-size: 32px; font-weight: 800; color: #1a1a2e; line-height: 1; letter-spacing: -1.5px; }
.donut-sub { font-size: 10px; color: #aeaeb2; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 4px; }
.donut-legend { display: flex; flex-direction: column; gap: 7px; }
.legend-row { display: flex; align-items: center; gap: 8px; min-width: 120px; cursor: pointer; border-radius: 8px; padding: 3px 6px; margin: -3px -6px; transition: background 0.12s; }
.legend-row:hover { background: #f5f5f7; }
.legend-row.active-filter { background: #eef0ff; }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.leg-label { font-size: 13px; color: #3a3a3c; flex: 1; font-weight: 500; }
.leg-num { font-size: 14px; font-weight: 800; color: #1a1a2e; min-width: 20px; text-align: right; letter-spacing: -0.3px; }
.test-inline {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid #f0f0f4;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.test-inline-label { font-size: 11px; color: #aeaeb2; font-weight: 600; margin-right: 2px; }
.test-pip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; color: #3a3a3c;
  background: #f5f5f7; border-radius: 999px; padding: 2px 8px 2px 6px;
}
.test-pip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* Chart filter */
#donutChart { cursor: pointer; }
.chart-filter-banner {
  display: flex; align-items: center; gap: 10px;
  margin: 0 20px 10px;
  padding: 9px 14px;
  border-radius: 12px; font-size: 13px; font-weight: 500;
}
.chart-filter-banner strong { font-weight: 700; }
.chart-filter-clr {
  margin-left: auto; background: none; border: none; cursor: pointer;
  font-size: 12px; padding: 3px 8px; border-radius: 6px;
  font-family: inherit; font-weight: 600; opacity: 0.7;
  transition: opacity 0.12s;
}
.chart-filter-clr:hover { opacity: 1; }

/* ===== CARDS GRID ===== */
.cards-grid {
  padding: 0 20px 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
@media (max-width: 900px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .cards-grid { grid-template-columns: 1fr; padding: 0 12px 20px; } }

.job-card {
  background: #fff; border: 1px solid #e5e5ea; border-radius: 16px;
  padding: 14px 16px; cursor: pointer;
  display: flex; flex-direction: column; gap: 6px;
  transition: box-shadow 0.15s, border-color 0.15s;
  height: 185px; overflow: hidden; /* фиксированная высота, контент не вылезает */
}
.card-spacer { flex: 1; min-height: 0; }
.card-title {
  font-size: 14px; font-weight: 700; color: #1a1a1a; line-height: 1.35;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  word-break: break-word;
}
.card-company-name {
  font-size: 13px; font-weight: 600; color: #1a1a1a; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.job-card:hover { border-color: #c7c7cc; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.job-card.card-offer { background: #f0faf0; border-color: #b2dfdb; }
.job-card.card-reject { opacity: 0.45; }
.job-card.card-ignore { background: #f5f5f7; }
.job-card.card-test-got  { background: #eef0ff; border-left: 3px solid #5c6eff; }
.job-card.card-test-doing { background: #fff8e6; border-left: 3px solid #f59e0b; }
.job-card.card-test-sent { background: #f0fdf4; border-left: 3px solid #22c55e; }
.job-card.card-priority { background: #fffdf0 !important; box-shadow: none !important; border-color: #e5e5ea !important; }
.job-card.card-priority.card-offer { background: #f0faf0 !important; box-shadow: none !important; }

@keyframes cardFlash {
  0%   { box-shadow: 0 0 0 3px #ffd60a, 0 4px 20px rgba(255,214,10,0.5); }
  50%  { box-shadow: 0 0 0 4px #ffd60a, 0 6px 28px rgba(255,214,10,0.7); }
  100% { box-shadow: 0 0 0 2px #ffd60a, 0 2px 8px rgba(0,0,0,0.06); }
}
.card-flash { animation: cardFlash 1.4s ease-out forwards; }

.card-top-row {
  display: flex; align-items: center; gap: 8px;
}
.card-avatar {
  width: 32px; height: 32px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.card-applied-date { font-size: 11px; color: #aeaeb2; white-space: nowrap; flex-shrink: 0; }
.card-star { font-size: 13px; color: #f59e0b; flex-shrink: 0; line-height: 1; }
.card-bottom-row {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px;
}
.card-badge {
  font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
  border: 1px solid transparent;
}
.card-badge-source { background: #f0f0f4; color: #6e6e73; }
.card-badge-status-offer  { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
.card-badge-status-reject { background: #f3f4f6; color: #6b7280; border-color: #e5e7eb; }
.card-badge-status-ignore { background: #fef3c7; color: #92400e; border-color: #fde68a; }
.card-badge-status-test-got   { background: #eef0ff; color: #3730a3; border-color: #c7d2fe; }
.card-badge-status-test-doing { background: #fef3c7; color: #92400e; border-color: #fde68a; }
.card-badge-status-test-sent  { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
.card-badge-status-hr    { background: #eef0ff; color: #3730a3; border-color: #c7d2fe; }
.card-badge-status-tech  { background: #f5f3ff; color: #5b21b6; border-color: #ddd6fe; }
.card-badge-status-final { background: #fef3c7; color: #92400e; border-color: #fde68a; }

/* ===== CUSTOM DATE PICKER ===== */
.dp-popup {
  position: fixed; z-index: 3000;
  background: #fff; border-radius: 16px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
  padding: 14px; width: 232px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  animation: dpIn 0.15s ease;
}
@keyframes dpIn { from { opacity:0; transform: scale(0.95) translateY(-4px); } to { opacity:1; transform: none; } }
.dp-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.dp-month-label { font-size: 14px; font-weight: 700; color: #1a1a1a; }
.dp-nav {
  background: #f0f0f4; border: none; border-radius: 8px;
  width: 28px; height: 28px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  color: #3a3a3c; line-height: 1;
}
.dp-nav:hover { background: #e5e5ea; }
.dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.dp-dn { font-size: 10px; color: #8e8e93; text-align: center; padding: 3px 0 5px; font-weight: 600; }
.dp-d {
  font-size: 13px; text-align: center; padding: 5px 2px;
  border-radius: 8px; cursor: pointer; border: none;
  background: none; font-family: inherit; color: #1a1a1a; line-height: 1.2;
}
.dp-d:hover { background: #f0f0f4; }
.dp-d.dp-today { color: #0a84ff; font-weight: 700; }
.dp-d.dp-sel { background: #0a84ff !important; color: #fff; font-weight: 600; }
.dp-d.dp-empty { cursor: default; pointer-events: none; }
.dp-clear {
  width: 100%; margin-top: 8px; padding: 7px;
  background: none; border: none; color: #8e8e93; font-size: 12px;
  cursor: pointer; border-radius: 8px; font-family: inherit;
}
.dp-clear:hover { background: #f5f5f7; color: #ff3b30; }

/* ===== ADD MODAL ===== */
.add-btn {
  background: #0a84ff; color: #fff; border: none; border-radius: 10px;
  padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: inherit; display: flex; align-items: center; gap: 6px;
  letter-spacing: -0.1px;
}
.add-btn:hover { background: #0071e3; }
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.4); align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: 20px; padding: 24px;
  width: 100%; max-width: 420px; margin: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  animation: modalIn 0.2s ease;
}
@keyframes modalIn { from { opacity:0; transform: scale(0.95) translateY(8px); } to { opacity:1; transform: none; } }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
.modal-field { margin-bottom: 12px; }
.modal-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #8e8e93; margin-bottom: 5px; display: block; }
.modal-input {
  width: 100%; padding: 10px 12px; border: 1.5px solid #e5e5ea;
  border-radius: 10px; font-size: 14px; font-family: inherit;
  background: #f5f5f7; color: #1a1a1a; box-sizing: border-box;
  transition: border-color 0.15s, background 0.15s;
}
.modal-input:focus { outline: none; border-color: #0a84ff; background: #fff; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }
.modal-save { flex: 1; padding: 12px; background: #0a84ff; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
.modal-save:hover { background: #0071e3; }
.modal-cancel { padding: 12px 16px; background: #f5f5f7; color: #6e6e73; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; font-family: inherit; }
.modal-cancel:hover { background: #e5e5ea; }

/* ===== DETAIL MODAL ===== */
.detail-overlay {
  display: none; position: fixed; inset: 0; z-index: 1500;
  background: rgba(0,0,0,0.45); align-items: center; justify-content: center;
}
.detail-overlay.open { display: flex; }
.detail-modal {
  background: #fff; border-radius: 20px;
  width: 100%; max-width: 540px; margin: 16px;
  max-height: calc(100vh - 40px); overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.22);
  animation: modalIn 0.2s ease;
  display: flex; flex-direction: column;
}
@media (max-width: 600px) {
  .detail-overlay { align-items: flex-end; }
  .detail-modal { border-radius: 20px 20px 0 0; margin: 0; max-height: 92vh; }
}
.detail-header {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 20px 20px 14px;
  border-bottom: 1px solid #f0f0f4;
  position: sticky; top: 0; background: #fff; z-index: 10;
  border-radius: 20px 20px 0 0;
}
.detail-header-info { flex: 1; min-width: 0; }
.detail-header-title { font-size: 17px; font-weight: 700; color: #1a1a1a; line-height: 1.3; word-break: break-word; }
.detail-header-sub {
  margin-top: 4px; font-size: 12px; color: #8e8e93;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.detail-header-link {
  font-size: 12px; font-weight: 600; color: #0a84ff;
  text-decoration: none; padding: 1px 6px; border-radius: 6px;
  border: 1px solid #c7ddff; background: #f0f7ff;
}
.detail-header-link:hover { background: #daeeff; }
.detail-close {
  background: #f5f5f7; border: none; border-radius: 10px;
  width: 32px; height: 32px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  color: #6e6e73; flex-shrink: 0;
}
.detail-close:hover { background: #e5e5ea; color: #1a1a1a; }
.detail-body { padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 18px; }
.detail-section { display: flex; flex-direction: column; gap: 10px; }
.detail-section-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.8px; color: #aeaeb2;
}
.detail-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.detail-field-label { font-size: 12px; color: #8e8e93; min-width: 60px; flex-shrink: 0; }

/* date-wrap shared */
.date-wrap { display: flex; align-items: center; gap: 3px; }
.date-btn {
  background: none; border: 1px dashed #d0d0d5; border-radius: 6px;
  padding: 4px 8px; font-size: 12px; color: #8e8e93;
  cursor: pointer; white-space: nowrap; font-family: inherit;
}
.date-btn:hover { border-color: #8e8e93; color: #3a3a3c; background: #f5f5f7; }
.date-btn.filled { border-style: solid; border-color: #e5e5ea; color: #1a1a1a; background: #fff; font-weight: 500; }
.date-clr {
  background: none; border: none; cursor: pointer;
  color: #c7c7cc; font-size: 11px; padding: 2px 3px; line-height: 1;
  font-family: inherit;
}
.date-clr:hover { color: #8e8e93; }

/* result select */
.result-sel {
  border: 1px solid #e5e5ea; border-radius: 8px;
  padding: 5px 8px; font-size: 13px; background: #fff;
  color: #1a1a1a; cursor: pointer;
  font-family: inherit; appearance: none; -webkit-appearance: none;
}
.result-sel:focus { outline: none; border-color: #0a84ff; }

/* ===== TEST STAGES ===== */
.test-stages { display: flex; gap: 4px; flex-wrap: wrap; }
.test-stage-btn {
  font-size: 12px; padding: 5px 10px; border-radius: 8px;
  border: 1px solid #e5e5ea; background: #f5f5f7;
  color: #8e8e93; cursor: pointer; font-family: inherit; white-space: nowrap;
}
.test-stage-btn:hover { border-color: #8e8e93; color: #3a3a3c; }
.test-stage-btn.active { font-weight: 600; }
.test-stage-btn.got.active   { background: #eef0ff; border-color: #5c6eff; color: #3730a3; }
.test-stage-btn.doing.active { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
.test-stage-btn.sent.active  { background: #dcfce7; border-color: #22c55e; color: #15803d; }
.test-stage-btn.none.active  { background: #f0f0f4; border-color: #8e8e93; color: #3a3a3c; }

/* ===== INTERVIEW STAGES ===== */
.interview-stages { display: flex; gap: 4px; flex-wrap: wrap; }
.int-stage-btn {
  font-size: 12px; padding: 5px 10px; border-radius: 8px;
  border: 1px solid #e5e5ea; background: #f5f5f7;
  color: #8e8e93; cursor: pointer; font-family: inherit; white-space: nowrap;
}
.int-stage-btn:hover { border-color: #8e8e93; color: #3a3a3c; }
.int-stage-btn.hr.active     { background: #eef0ff; border-color: #5c6eff; color: #3730a3; font-weight: 600; }
.int-stage-btn.tech.active   { background: #f5f3ff; border-color: #8b5cf6; color: #5b21b6; font-weight: 600; }
.int-stage-btn.final.active  { background: #fef3c7; border-color: #f59e0b; color: #92400e; font-weight: 600; }

/* call section */
.call-platforms { display: flex; gap: 4px; flex-wrap: wrap; }
.call-platform-btn {
  font-size: 11px; padding: 3px 8px; border-radius: 6px;
  border: 1px solid #e5e5ea; background: #f5f5f7;
  color: #8e8e93; cursor: pointer; font-family: inherit; white-space: nowrap;
}
.call-platform-btn:hover { border-color: #8e8e93; color: #3a3a3c; }
.call-platform-btn.active { background: #e8f4ff; border-color: #0a84ff; color: #0a84ff; font-weight: 600; }
.call-time-inp {
  border: 1px dashed #d0d0d5; border-radius: 6px;
  padding: 3px 7px; font-size: 12px; color: #3a3a3c;
  font-family: inherit; background: none; width: 80px;
}
.call-time-inp:focus { outline: none; border-color: #0a84ff; border-style: solid; }
.call-detail-inp {
  border: 1px solid #d0d0d5; border-radius: 8px;
  padding: 6px 10px; font-size: 13px; color: #3a3a3c;
  font-family: inherit; background: #f9f9fb; width: 100%;
  box-sizing: border-box;
}
.call-detail-inp:focus { outline: none; border-color: #0a84ff; background: #fff; }
.call-detail-inp::placeholder { color: #b0b0b8; }
.call-verdict-row { display: flex; gap: 6px; margin-top: 2px; }
.call-verdict-btn {
  flex: 1; font-size: 12px; padding: 6px 8px; border-radius: 8px;
  border: 1.5px solid #e5e5ea; background: #f5f5f7;
  cursor: pointer; font-family: inherit; font-weight: 500;
  transition: background 0.12s, border-color 0.12s;
}
.call-verdict-btn.happened { border-color: #34c759; color: #1a7a3a; }
.call-verdict-btn.happened:hover { background: #edfaf2; }
.call-verdict-btn.missed { border-color: #ff9500; color: #a05000; }
.call-verdict-btn.missed:hover { background: #fff6e8; }
.call-status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px; font-weight: 600; padding: 6px 12px;
  border-radius: 10px; cursor: pointer; border: none;
  font-family: inherit; transition: opacity 0.15s;
}
.call-status-badge:hover { opacity: 0.7; }
.call-status-badge.happened { background: #edfaf2; color: #1a7a3a; }
.call-status-badge.missed   { background: #fff6e8; color: #a05000; }

/* note & contact */
.detail-note-inp, .detail-contact-inp {
  width: 100%; border: 1px solid #e5e5ea; border-radius: 10px;
  padding: 9px 12px; font-size: 13px; color: #1a1a1a;
  font-family: inherit; background: #f9f9fb; box-sizing: border-box;
  transition: border-color 0.15s;
}
.detail-note-inp:focus, .detail-contact-inp:focus { outline: none; border-color: #0a84ff; background: #fff; }
.detail-note-inp::placeholder, .detail-contact-inp::placeholder { color: #b0b0b8; }

/* detail footer */
.detail-footer {
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
  padding: 12px 20px 20px;
  border-top: 1px solid #f0f0f4;
}
.detail-priority-btn {
  display: flex; align-items: center; gap: 6px;
  background: #f5f5f7; border: 1.5px solid #e5e5ea; border-radius: 10px;
  padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 600;
  color: #3a3a3c; font-family: inherit; transition: all 0.15s;
}
.detail-priority-btn:hover { border-color: #f59e0b; background: #fff8e6; color: #92400e; }
.detail-priority-btn.active { background: #fff8e6; border-color: #f59e0b; color: #92400e; }
.detail-delete-btn {
  display: flex; align-items: center; gap: 6px;
  background: #fff0f0; border: 1.5px solid #ffc5c5; border-radius: 10px;
  padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 600;
  color: #c0392b; font-family: inherit; transition: all 0.15s;
}
.detail-delete-btn:hover { background: #ffe0e0; border-color: #ff9090; }

/* ===== EMPTY STATE ===== */
.empty-state { text-align: center; padding: 64px 20px; color: #8e8e93; font-size: 14px; }
.empty-state strong { display: block; font-size: 20px; color: #3a3a3c; margin-bottom: 8px; }

/* ===== SEARCH ===== */
.tracker-search-row {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 20px 8px;
}
.tracker-search-wrap { position: relative; flex: 1; }
.tracker-search-wrap::before {
  content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 13px; pointer-events: none; opacity: 0.5;
}
.tracker-search {
  width: 100%; padding: 8px 12px 8px 32px;
  border: 1.5px solid #e5e5ea; border-radius: 12px;
  font-size: 14px; font-family: inherit; background: #f5f5f7;
  color: #1a1a1a; transition: border-color 0.15s, background 0.15s;
  box-sizing: border-box;
}
.tracker-search:focus { outline: none; border-color: #0a84ff; background: #fff; }
.tracker-search::placeholder { color: #b0b0b8; }
.tracker-search-clr {
  display: none; background: none; border: none; cursor: pointer;
  color: #8e8e93; font-size: 16px; padding: 4px 8px; line-height: 1;
}
.tracker-search-clr:hover { color: #ff3b30; }
.tracker-search-clr.visible { display: block; }

/* ===== FAB ===== */
.fab { display: none; }
@media (max-width: 600px) {
  .fab {
    display: flex; align-items: center; justify-content: center;
    position: fixed; bottom: 24px; right: 20px; z-index: 200;
    width: 56px; height: 56px; border-radius: 50%;
    background: #5c6eff; color: #fff; border: none;
    box-shadow: 0 4px 16px rgba(92,110,255,0.45);
    font-size: 28px; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .fab:active { transform: scale(0.93); box-shadow: 0 2px 8px rgba(92,110,255,0.35); }
  .add-btn { display: none; }
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
  body { padding: 0 0 90px; background: #f2f2f7; font-size: 15px; }
  .pl-header { padding: 12px 16px 10px; }
  .stat-cards { padding: 0 12px 12px; }
  .charts-wrap { gap: 14px; flex-direction: column; }
  .chart-donut-section { align-self: stretch; }
  .tracker-search-row { padding: 0 12px 8px; }
  .empty-state { padding: 48px 20px; }
  .chart-filter-banner { margin: 0 12px 10px; }
}
</style>
</head>
<body>

<!-- ===== TRACKER ===== -->
<div id="panel-tracker">

  <div class="pl-header">
    <div class="pl-title">Трекер откликов</div>
    <span class="count-badge" id="cnt">0</span>
    <button class="add-btn" id="addVacancyBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Добавить
    </button>
  </div>

  <!-- Modal: add vacancy -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-title">Добавить вакансию</div>
      <div class="modal-field">
        <label class="modal-label">Ссылка *</label>
        <input class="modal-input" id="m-url" type="url" placeholder="https://hh.ru/vacancy/... или LinkedIn">
        <div id="m-fetch-status" style="margin-top:8px;font-size:12px;color:#8e8e93;min-height:18px;"></div>
      </div>
      <div id="m-manual-fields" style="display:none">
        <div class="modal-field">
          <label class="modal-label">Название вакансии</label>
          <input class="modal-input" id="m-title" type="text" placeholder="Например: Product Designer">
        </div>
        <div class="modal-field">
          <label class="modal-label">Компания</label>
          <input class="modal-input" id="m-company" type="text" placeholder="Название компании">
        </div>
      </div>
      <div class="modal-field">
        <label class="modal-label">Заметка</label>
        <input class="modal-input" id="m-note" type="text" placeholder="Необязательно">
      </div>
      <div class="modal-actions">
        <button class="modal-cancel" id="addModalCancel">Отмена</button>
        <button class="modal-save" id="addModalSave">Добавить</button>
      </div>
    </div>
  </div>

  <!-- Modal: detail -->
  <div class="detail-overlay" id="detailModal">
    <div class="detail-modal" id="detailModalInner">
      <!-- filled dynamically -->
    </div>
  </div>

  <div class="stat-cards" id="stat-cards"></div>

  <div class="tracker-search-row">
    <div class="tracker-search-wrap">
      <input class="tracker-search" id="tracker-search" type="text" placeholder="Поиск по вакансиям, компаниям, заметкам…" autocomplete="off">
    </div>
    <button class="tracker-search-clr" id="tracker-search-clr" title="Очистить">✕</button>
  </div>

  <div id="cards-grid" class="cards-grid"></div>
  <div class="empty-state" id="pl-empty" style="display:none">
    <strong>Пока пусто</strong>
    Нажми «Добавить» и занеси свою первую вакансию
  </div>

  <div id="date-pool" style="position:absolute;opacity:0;width:0;height:0;overflow:hidden;pointer-events:none"></div>

</div><!-- /panel-tracker -->

<!-- FAB -->
<button class="fab" id="fabBtn" aria-label="Добавить вакансию">+</button>

<script>
'use strict';

const jobMap = {};

(function() {
  const SK = 'designJobs.status.v1';
  const PK = 'designJobs.pipeline.v1';
  const PL_MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

  function plLs(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; } }
  function savePL(d) { localStorage.setItem(PK, JSON.stringify(d)); }

  function fmtPlDate(iso) {
    if (!iso) return null;
    const d = new Date(iso + 'T00:00:00');
    return d.getDate() + ' ' + PL_MONTHS[d.getMonth()];
  }

  function plEsc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function plSrcLabel(s) { return s || ''; }

  function getRows() {
    const status = plLs(SK);
    const pl = plLs(PK);
    const seen = new Set();
    const rows = [];
    for (const [url, st] of Object.entries(status)) {
      if (st !== 'applied' && st !== 'test') continue;
      seen.add(url);
      const j = jobMap[url] || {};
      rows.push({ url, title: j.t || url, source: j.s || '', ...(pl[url] || {}) });
    }
    for (const [url, data] of Object.entries(pl)) {
      if (seen.has(url)) continue;
      const j = jobMap[url] || {};
      rows.push({ url, title: data.title || j.t || url, source: data.source || j.s || '', ...data });
    }
    return rows;
  }

  function getPF(url, field) { return (plLs(PK)[url] || {})[field] || null; }

  function setPF(url, field, value) {
    const p = plLs(PK);
    if (!p[url]) p[url] = {};
    if (value != null && value !== '') p[url][field] = value;
    else delete p[url][field];
    savePL(p);
  }

  // ===== CUSTOM DATE PICKER =====
  let dpPopup = null;
  const DP_MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const DP_DAYS   = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  function closeDp() { if (dpPopup) { dpPopup.remove(); dpPopup = null; } }

  function openDp(anchorEl, currentIso, onSelect) {
    closeDp();
    const today = new Date();
    const sel   = currentIso ? new Date(currentIso + 'T00:00:00') : null;
    let vy = sel ? sel.getFullYear() : today.getFullYear();
    let vm = sel ? sel.getMonth()    : today.getMonth();

    dpPopup = document.createElement('div');
    dpPopup.className = 'dp-popup';
    document.body.appendChild(dpPopup);

    function drawDp() {
      const first    = new Date(vy, vm, 1);
      const total    = new Date(vy, vm + 1, 0).getDate();
      const startDow = (first.getDay() + 6) % 7;
      let days = DP_DAYS.map(d => '<span class="dp-dn">'+d+'</span>').join('');
      for (let i = 0; i < startDow; i++) days += '<button class="dp-d dp-empty"></button>';
      for (let d = 1; d <= total; d++) {
        const isT = today.getFullYear()===vy && today.getMonth()===vm && today.getDate()===d;
        const isS = sel && sel.getFullYear()===vy && sel.getMonth()===vm && sel.getDate()===d;
        days += '<button class="dp-d'+(isT?' dp-today':'')+(isS?' dp-sel':'')+'" data-d="'+d+'">'+d+'</button>';
      }
      dpPopup.innerHTML =
        '<div class="dp-header">'+
          '<button class="dp-nav" id="dpPrev">‹</button>'+
          '<span class="dp-month-label">'+DP_MONTHS[vm]+' '+vy+'</span>'+
          '<button class="dp-nav" id="dpNext">›</button>'+
        '</div>'+
        '<div class="dp-grid">'+days+'</div>'+
        '<button class="dp-clear">Очистить</button>';
      dpPopup.querySelector('#dpPrev').onclick = e => { e.stopPropagation(); vm--; if(vm<0){vm=11;vy--;} drawDp(); };
      dpPopup.querySelector('#dpNext').onclick = e => { e.stopPropagation(); vm++; if(vm>11){vm=0;vy++;} drawDp(); };
      dpPopup.querySelector('.dp-clear').onclick = e => { e.stopPropagation(); onSelect(null); closeDp(); };
      dpPopup.querySelectorAll('.dp-d[data-d]').forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          const iso = vy+'-'+String(vm+1).padStart(2,'0')+'-'+String(+btn.dataset.d).padStart(2,'0');
          onSelect(iso); closeDp();
        };
      });
    }
    drawDp();

    const r = anchorEl.getBoundingClientRect();
    let top = r.bottom + 6, left = r.left;
    if (left + 240 > window.innerWidth - 8) left = window.innerWidth - 248;
    if (top + 320 > window.innerHeight)     top  = r.top - 320 - 6;
    dpPopup.style.cssText += ';top:'+top+'px;left:'+left+'px';
  }
  document.addEventListener('click', closeDp);

  // ===== TRACKER SEARCH =====
  (function() {
    const inp = document.getElementById('tracker-search');
    const clr = document.getElementById('tracker-search-clr');
    if (!inp) return;
    inp.addEventListener('input', () => {
      clr.classList.toggle('visible', inp.value.length > 0);
      if (typeof window.renderTracker === 'function') window.renderTracker();
    });
    clr.addEventListener('click', () => {
      inp.value = '';
      clr.classList.remove('visible');
      if (typeof window.renderTracker === 'function') window.renderTracker();
      inp.focus();
    });
  })();

  let donutChart = null;
  let chartFilter = null;

  // ===== AVATAR COLORS =====
  const AVATAR_COLORS = ['#5c6eff','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];
  function avatarColor(company) {
    const s = (company || '?');
    return AVATAR_COLORS[s.charCodeAt(0) % AVATAR_COLORS.length];
  }

  // ===== DETAIL MODAL =====
  let detailUrl = null;

  function openDetail(url) {
    detailUrl = url;
    renderDetail();
    document.getElementById('detailModal').classList.add('open');
  }

  function closeDetail() {
    document.getElementById('detailModal').classList.remove('open');
    detailUrl = null;
  }

  document.getElementById('detailModal').addEventListener('click', e => {
    if (e.target === document.getElementById('detailModal')) closeDetail();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('detailModal').classList.contains('open')) closeDetail();
  });

  function isCallPast(callDate, callTime) {
    if (!callDate) return false;
    return Date.now() > new Date(callDate + 'T' + (callTime || '23:59') + ':00').getTime();
  }

  function renderDetail() {
    if (!detailUrl) return;
    const p = plLs(PK)[detailUrl] || {};
    const allRows = getRows();
    const r = allRows.find(x => x.url === detailUrl) || { url: detailUrl, title: detailUrl, source: '' };
    const displayTitle = p.title || r.title || detailUrl;
    const company = p.company || '';
    const source = p.source || r.source || '';

    const TEST_STAGES = ['получила','делаю','отправила','не было'];
    const STAGE_CLS = { 'получила': 'got', 'делаю': 'doing', 'отправила': 'sent', 'не было': 'none' };
    const INT_STAGES = [['HR','hr'],['Тех','tech'],['Финал','final']];
    const CALL_PLATFORMS = ['Meet','Zoom','Telegram','Телефон','Офис'];
    const CALL_PLACEHOLDERS = { 'Meet':'meet.google.com/...','Zoom':'zoom.us/j/...','Telegram':'@username','Телефон':'+7 ...','Офис':'Адрес офиса' };

    const callDate = p.callDate || null;
    const callTime = p.callTime || '';
    const callPlatform = p.callPlatform || '';
    const callDetail = p.callDetail || '';
    const callStatus = p.callStatus || null;
    const showVerdict = callDate && isCallPast(callDate, callTime) && !callStatus;

    const callSection = callStatus
      ? '<button class="call-status-badge '+(callStatus==='happened'?'happened':'missed')+' dm-call-undo" style="margin-top:4px">'+(callStatus==='happened'?'✓ состоялся':'✗ не состоялся')+' <span style="font-size:10px;opacity:0.6">↩</span></button>'
      : '<div style="display:flex;flex-direction:column;gap:8px">'+
          '<div class="date-wrap">'+
            '<button class="date-btn'+(callDate?' filled':'')+' dm-dp-trigger" data-field="callDate" data-val="'+(callDate||'')+'">'+
              (callDate ? plEsc(fmtPlDate(callDate)) : '+ дата')+
            '</button>'+
            (callDate ? '<button class="date-clr dm-date-clr" data-field="callDate">✕</button>' : '')+
            (callDate ? '<input class="call-time-inp" id="dm-call-time" data-url="'+plEsc(detailUrl)+'" type="time" value="'+plEsc(callTime)+'">' : '')+
          '</div>'+
          '<div class="call-platforms">'+
            CALL_PLATFORMS.map(pt => '<button class="call-platform-btn'+(callPlatform===pt?' active':'')+' dm-platform" data-platform="'+pt+'">'+pt+'</button>').join('')+
          '</div>'+
          (callPlatform ? '<input class="call-detail-inp" id="dm-call-detail" value="'+plEsc(callDetail)+'" placeholder="'+plEsc(CALL_PLACEHOLDERS[callPlatform]||'детали...')+'">' : '')+
          (showVerdict ? '<div class="call-verdict-row"><button class="call-verdict-btn happened dm-verdict" data-verdict="happened">✓ состоялся</button><button class="call-verdict-btn missed dm-verdict" data-verdict="missed">✗ не состоялся</button></div>' : '')+
        '</div>';

    const inner = document.getElementById('detailModalInner');
    inner.innerHTML =
      '<div class="detail-header">'+
        '<div class="detail-header-info">'+
          '<div class="detail-header-title">'+plEsc(displayTitle)+'</div>'+
          '<div class="detail-header-sub">'+
            (company ? plEsc(company)+' · ' : '')+
            (source ? plEsc(source) : '')+
            ' <a class="detail-header-link" href="'+plEsc(detailUrl)+'" target="_blank" rel="noopener">→ Открыть</a>'+
          '</div>'+
        '</div>'+
        '<button class="detail-close" id="dm-close">✕</button>'+
      '</div>'+

      '<div class="detail-body">'+

        '<div class="detail-section">'+
          '<div class="detail-section-label">Отклик</div>'+
          '<div class="date-wrap">'+
            '<button class="date-btn'+(p.appliedDate?' filled':'')+' dm-dp-trigger" data-field="appliedDate" data-val="'+(p.appliedDate||'')+'">'+
              (p.appliedDate ? plEsc(fmtPlDate(p.appliedDate)) : '+ дата')+
            '</button>'+
            (p.appliedDate ? '<button class="date-clr dm-date-clr" data-field="appliedDate">✕</button>' : '')+
          '</div>'+
        '</div>'+

        '<div class="detail-section">'+
          '<div class="detail-section-label">Итог</div>'+
          '<select class="result-sel" id="dm-result">'+
            '<option value="">—</option>'+
            '<option value="offer"'+(p.result==='offer'?' selected':'')+'>🎉 Оффер</option>'+
            '<option value="reject"'+(p.result==='reject'?' selected':'')+'>❌ Отказ</option>'+
            '<option value="ignore"'+(p.result==='ignore'?' selected':'')+'>🙈 Игнор</option>'+
          '</select>'+
        '</div>'+

        '<div class="detail-section">'+
          '<div class="detail-section-label">Тестовое</div>'+
          '<div class="test-stages">'+
            TEST_STAGES.map(s =>
              '<button class="test-stage-btn '+STAGE_CLS[s]+(p.testStage===s?' active':'')+' dm-test-stage" data-stage="'+s+'">'+s+'</button>'
            ).join('')+
          '</div>'+
        '</div>'+

        '<div class="detail-section">'+
          '<div class="detail-section-label">Этап интервью</div>'+
          '<div class="interview-stages">'+
            INT_STAGES.map(([label, key]) =>
              '<button class="int-stage-btn '+key+(p.interviewStage===key?' active':'')+' dm-int-stage" data-istage="'+key+'">'+label+'</button>'
            ).join('')+
          '</div>'+
        '</div>'+

        '<div class="detail-section">'+
          '<div class="detail-section-label">Созвон</div>'+
          callSection+
        '</div>'+

        '<div class="detail-section">'+
          '<div class="detail-section-label">Заметка</div>'+
          '<input class="detail-note-inp" id="dm-note" value="'+plEsc(p.note||'')+'" placeholder="Заметки о вакансии…">'+
        '</div>'+

        '<div class="detail-section">'+
          '<div class="detail-section-label">Контакт HR</div>'+
          '<input class="detail-contact-inp" id="dm-contact" value="'+plEsc(p.contactInfo||'')+'" placeholder="Имя, email, telegram…">'+
        '</div>'+

      '</div>'+

      '<div class="detail-footer">'+
        '<button class="detail-priority-btn'+(p.priority?' active':'')+'" id="dm-priority">'+
          (p.priority ? '★ Приоритет' : '☆ Приоритет')+
        '</button>'+
        '<button class="detail-delete-btn" id="dm-delete">🗑 Удалить</button>'+
      '</div>';

    // Bind events
    inner.querySelector('#dm-close').addEventListener('click', closeDetail);

    inner.querySelectorAll('.dm-dp-trigger').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        openDp(btn, btn.dataset.val || null, iso => {
          setPF(detailUrl, btn.dataset.field, iso);
          renderTracker();
          renderDetail();
        });
      });
    });

    inner.querySelectorAll('.dm-date-clr').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        setPF(detailUrl, btn.dataset.field, null);
        renderTracker();
        renderDetail();
      });
    });

    const resultSel = inner.querySelector('#dm-result');
    if (resultSel) {
      resultSel.addEventListener('change', () => {
        setPF(detailUrl, 'result', resultSel.value || null);
        renderTracker();
      });
    }

    inner.querySelectorAll('.dm-test-stage').forEach(btn => {
      btn.addEventListener('click', () => {
        const cur = getPF(detailUrl, 'testStage');
        setPF(detailUrl, 'testStage', cur === btn.dataset.stage ? null : btn.dataset.stage);
        renderTracker();
        renderDetail();
      });
    });

    inner.querySelectorAll('.dm-int-stage').forEach(btn => {
      btn.addEventListener('click', () => {
        const cur = getPF(detailUrl, 'interviewStage');
        setPF(detailUrl, 'interviewStage', cur === btn.dataset.istage ? null : btn.dataset.istage);
        renderTracker();
        renderDetail();
      });
    });

    inner.querySelectorAll('.dm-platform').forEach(btn => {
      btn.addEventListener('click', () => {
        const cur = getPF(detailUrl, 'callPlatform');
        const next = cur === btn.dataset.platform ? null : btn.dataset.platform;
        if (next !== cur) setPF(detailUrl, 'callDetail', null);
        setPF(detailUrl, 'callPlatform', next);
        renderTracker();
        renderDetail();
        if (next) setTimeout(() => { const inp = inner.querySelector('#dm-call-detail'); if (inp) inp.focus(); }, 50);
      });
    });

    const callTimeInp = inner.querySelector('#dm-call-time');
    if (callTimeInp) {
      const saveTime = () => setPF(detailUrl, 'callTime', callTimeInp.value || null);
      callTimeInp.addEventListener('change', saveTime);
      callTimeInp.addEventListener('blur', saveTime);
      callTimeInp.addEventListener('input', saveTime);
    }

    const callDetailInp = inner.querySelector('#dm-call-detail');
    if (callDetailInp) {
      const saveDet = () => setPF(detailUrl, 'callDetail', callDetailInp.value.trim() || null);
      callDetailInp.addEventListener('input', () => { saveDet(); renderTracker(); });
      callDetailInp.addEventListener('blur', saveDet);
    }

    inner.querySelectorAll('.dm-verdict').forEach(btn => {
      btn.addEventListener('click', () => {
        setPF(detailUrl, 'callStatus', btn.dataset.verdict);
        renderTracker();
        renderDetail();
      });
    });

    const callUndo = inner.querySelector('.dm-call-undo');
    if (callUndo) {
      callUndo.addEventListener('click', () => {
        setPF(detailUrl, 'callStatus', null);
        renderTracker();
        renderDetail();
      });
    }

    const noteInp = inner.querySelector('#dm-note');
    if (noteInp) {
      const saveNote = () => { setPF(detailUrl, 'note', noteInp.value || null); renderTracker(); };
      noteInp.addEventListener('input', saveNote);
      noteInp.addEventListener('blur', saveNote);
    }

    const contactInp = inner.querySelector('#dm-contact');
    if (contactInp) {
      const saveCont = () => { setPF(detailUrl, 'contactInfo', contactInp.value.trim() || null); renderTracker(); };
      contactInp.addEventListener('input', saveCont);
      contactInp.addEventListener('blur', saveCont);
    }

    const prioBtn = inner.querySelector('#dm-priority');
    if (prioBtn) {
      prioBtn.addEventListener('click', () => {
        setPF(detailUrl, 'priority', getPF(detailUrl, 'priority') ? null : true);
        renderTracker();
        renderDetail();
      });
    }

    const delBtn = inner.querySelector('#dm-delete');
    if (delBtn) {
      delBtn.addEventListener('click', () => {
        if (!confirm('Удалить вакансию из трекера?')) return;
        const url = detailUrl;
        closeDetail();
        const pl2 = plLs(PK); delete pl2[url]; savePL(pl2);
        const s = plLs(SK);
        if (s[url]) { s[url] = 'skip'; localStorage.setItem(SK, JSON.stringify(s)); }
        renderTracker();
      });
    }
  }

  // ===== RENDER TRACKER (cards) =====
  function renderTracker() {
    const grid = document.getElementById('cards-grid');
    if (!grid) return;

    const searchQ = (document.getElementById('tracker-search')?.value || '').trim().toLowerCase();
    const allRows = getRows();
    const rows = searchQ ? allRows.filter(r => {
      const pl2 = plLs(PK);
      const note  = ((pl2[r.url] || {}).note || '').toLowerCase();
      const title = (r.title || '').toLowerCase();
      const src   = (r.source || '').toLowerCase();
      const co    = ((pl2[r.url] || {}).company || '').toLowerCase();
      return note.includes(searchQ) || title.includes(searchQ) || src.includes(searchQ) || co.includes(searchQ);
    }) : allRows;

    const pl    = plLs(PK);
    const allPl = plLs(PK);
    rows.sort((a, b) => {
      const pa = allPl[a.url] || {}, pb = allPl[b.url] || {};
      // 1. Приоритетные выше обычных
      const prioA = pa.priority ? 1 : 0, prioB = pb.priority ? 1 : 0;
      if (prioB !== prioA) return prioB - prioA;
      // 2. Внутри группы — новее (по дате отклика или добавления) сверху
      const dateA = pa.appliedDate || pa.addedAt || '';
      const dateB = pb.appliedDate || pb.addedAt || '';
      if (dateB > dateA) return 1;
      if (dateA > dateB) return -1;
      return 0;
    });

    const total   = allRows.length;
    const offers  = allRows.filter(r => (allPl[r.url]||{}).result === 'offer').length;
    const rejects = allRows.filter(r => (allPl[r.url]||{}).result === 'reject').length;
    const ignores = allRows.filter(r => (allPl[r.url]||{}).result === 'ignore').length;
    const active  = total - offers - rejects - ignores;
    const tGot   = allRows.filter(r => (allPl[r.url]||{}).testStage === 'получила').length;
    const tDoing = allRows.filter(r => (allPl[r.url]||{}).testStage === 'делаю').length;
    const tSent  = allRows.filter(r => (allPl[r.url]||{}).testStage === 'отправила').length;

    document.getElementById('cnt').textContent = total;

    // ===== CHARTS =====
    (function renderCharts() {
      const BASE_COLORS = { active: '#5c6eff', offer: '#22c55e', ignore: '#f59e0b', reject: '#94a3b8' };
      function segColor(key) {
        if (!chartFilter) return BASE_COLORS[key];
        return chartFilter === key ? BASE_COLORS[key] : BASE_COLORS[key] + '55';
      }
      function legRow(key, label, num) {
        if (!num) return '';
        const isActive = chartFilter === key;
        return '<div class="legend-row'+(isActive?' active-filter':'')+'" data-filter="'+key+'">'+
          '<span class="leg-dot" style="background:'+BASE_COLORS[key]+'"></span>'+
          '<span class="leg-label">'+label+'</span>'+
          '<span class="leg-num">'+num+'</span>'+
        '</div>';
      }
      function pip(color, label, num) {
        if (!num) return '';
        return '<span class="test-pip"><span class="test-pip-dot" style="background:'+color+'"></span>'+label+' '+num+'</span>';
      }
      const testTotal2 = tGot + tDoing + tSent;
      const testInline = testTotal2
        ? '<div class="test-inline"><span class="test-inline-label">📝 Тест</span>'+
            pip(BASE_COLORS.active, 'получила', tGot)+
            pip(BASE_COLORS.ignore, 'делаю',    tDoing)+
            pip(BASE_COLORS.offer,  'отправила', tSent)+
          '</div>'
        : '';

      const html = '<div class="charts-wrap">'+
        '<div class="chart-donut-section">'+
          '<div class="donut-container">'+
            '<canvas id="donutChart" width="190" height="190"></canvas>'+
            '<div class="donut-center-label">'+
              '<div class="donut-num">'+total+'</div>'+
              '<div class="donut-sub">откликов</div>'+
            '</div>'+
          '</div>'+
          '<div class="donut-legend" id="donutLegend">'+
            legRow('active', 'В работе', active)+
            legRow('offer',  'Оффер 🎉', offers)+
            legRow('ignore', 'Игнор',    ignores)+
            legRow('reject', 'Отказ',    rejects)+
            testInline+
          '</div>'+
        '</div>'+
      '</div>';
      document.getElementById('stat-cards').innerHTML = html;

      document.getElementById('donutLegend').querySelectorAll('.legend-row').forEach(row => {
        row.addEventListener('click', () => {
          chartFilter = (chartFilter === row.dataset.filter) ? null : row.dataset.filter;
          renderTracker();
        });
      });

      const segments = [
        { key: 'active', val: active  },
        { key: 'offer',  val: offers  },
        { key: 'ignore', val: ignores },
        { key: 'reject', val: rejects },
      ].filter(s => s.val > 0);
      const chartData   = segments.map(s => s.val);
      const chartColors = segments.map(s => segColor(s.key));
      const segKeys     = segments.map(s => s.key);
      if (!chartData.length) { chartData.push(1); chartColors.push('#f0f0f4'); }

      const ctx = document.getElementById('donutChart');
      if (!ctx || typeof Chart === 'undefined') return;
      if (donutChart) { donutChart.destroy(); donutChart = null; }
      donutChart = new Chart(ctx, {
        type: 'doughnut',
        data: { datasets: [{ data: chartData, backgroundColor: chartColors, borderWidth: 0, hoverOffset: 4 }] },
        options: {
          cutout: '76%',
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          animation: { duration: 300 },
          responsive: false,
          onClick: (evt, elements) => {
            if (!elements.length) { chartFilter = null; renderTracker(); return; }
            const clicked = segKeys[elements[0].index];
            chartFilter = (chartFilter === clicked) ? null : clicked;
            renderTracker();
          }
        }
      });
    })();

    // ===== FILTER BANNER =====
    (function updateFilterBanner() {
      const existing = document.querySelector('.chart-filter-banner');
      if (existing) existing.remove();
      if (!chartFilter) return;
      const LABELS = { active: 'В работе', offer: 'Оффер 🎉', ignore: 'Игнор', reject: 'Отказ' };
      const THEME = {
        active: { bg: 'rgba(92,110,255,0.1)',   border: 'rgba(92,110,255,0.3)',  color: '#3730a3', btn: 'rgba(92,110,255,0.15)' },
        offer:  { bg: 'rgba(34,197,94,0.1)',    border: 'rgba(34,197,94,0.35)',  color: '#15803d', btn: 'rgba(34,197,94,0.15)'  },
        ignore: { bg: 'rgba(245,158,11,0.1)',   border: 'rgba(245,158,11,0.35)', color: '#92400e', btn: 'rgba(245,158,11,0.15)' },
        reject: { bg: 'rgba(148,163,184,0.12)', border: 'rgba(148,163,184,0.4)', color: '#475569', btn: 'rgba(148,163,184,0.2)' },
      };
      const t = THEME[chartFilter] || THEME.active;
      const count = rows.filter(r => {
        const res = (allPl[r.url]||{}).result || null;
        return chartFilter === 'active' ? !['offer','reject','ignore'].includes(res) : res === chartFilter;
      }).length;
      const banner = document.createElement('div');
      banner.className = 'chart-filter-banner';
      banner.style.cssText = 'background:'+t.bg+';border:1.5px solid '+t.border+';color:'+t.color;
      banner.innerHTML = 'Фильтр: <strong>'+LABELS[chartFilter]+'</strong> · '+count+' вак.'+
        '<button class="chart-filter-clr" style="color:'+t.color+'">✕ Сбросить</button>';
      banner.querySelector('.chart-filter-clr').addEventListener('click', () => { chartFilter = null; renderTracker(); });
      const cardsGrid = document.getElementById('cards-grid');
      if (cardsGrid) cardsGrid.parentNode.insertBefore(banner, cardsGrid);
    })();

    // ===== APPLY CHART FILTER =====
    const displayRows = chartFilter ? rows.filter(r => {
      const res = (allPl[r.url]||{}).result || null;
      return chartFilter === 'active' ? !['offer','reject','ignore'].includes(res) : res === chartFilter;
    }) : rows;

    const plEmpty = document.getElementById('pl-empty');
    if (displayRows.length === 0) {
      grid.style.display = 'none'; plEmpty.style.display = 'block';
      plEmpty.innerHTML = chartFilter
        ? '<strong>Никого нет</strong>В этой категории пока пусто'
        : (searchQ
          ? '<strong>Ничего не найдено</strong>Попробуй другой запрос'
          : '<strong>Пока пусто</strong>Нажми «Добавить» и занеси свою первую вакансию');
      return;
    }
    grid.style.display = ''; plEmpty.style.display = 'none';

    // Build cards
    grid.innerHTML = displayRows.map(r => {
      const p = pl[r.url] || {};
      const company = p.company || r.source || '';
      const displayName = p.company || '';
      const avatarLetter = (displayName || r.title || '?').charAt(0).toUpperCase();
      const color = avatarColor(displayName || r.title || '');
      const appliedDateStr = p.appliedDate ? fmtPlDate(p.appliedDate) : '';

      // Card class
      let cardCls = 'job-card';
      if (p.priority) cardCls += ' card-priority';
      if (p.result === 'offer') cardCls += ' card-offer';
      else if (p.result === 'reject') cardCls += ' card-reject';
      else if (p.result === 'ignore') cardCls += ' card-ignore';
      else if (p.testStage === 'получила') cardCls += ' card-test-got';
      else if (p.testStage === 'делаю') cardCls += ' card-test-doing';
      else if (p.testStage === 'отправила') cardCls += ' card-test-sent';

      // Status badge
      let statusBadge = '';
      if (p.result === 'offer')  statusBadge = '<span class="card-badge card-badge-status-offer">🎉 Оффер</span>';
      else if (p.result === 'reject') statusBadge = '<span class="card-badge card-badge-status-reject">❌ Отказ</span>';
      else if (p.result === 'ignore') statusBadge = '<span class="card-badge card-badge-status-ignore">🙈 Игнор</span>';
      else if (p.testStage === 'получила') statusBadge = '<span class="card-badge card-badge-status-test-got">📝 Тест</span>';
      else if (p.testStage === 'делаю')   statusBadge = '<span class="card-badge card-badge-status-test-doing">✍️ Делаю тест</span>';
      else if (p.testStage === 'отправила') statusBadge = '<span class="card-badge card-badge-status-test-sent">✅ Тест отправлен</span>';
      else if (p.interviewStage === 'hr')   statusBadge = '<span class="card-badge card-badge-status-hr">HR</span>';
      else if (p.interviewStage === 'tech') statusBadge = '<span class="card-badge card-badge-status-tech">Тех</span>';
      else if (p.interviewStage === 'final') statusBadge = '<span class="card-badge card-badge-status-final">Финал</span>';

      const sourceBadge = r.source ? '<span class="card-badge card-badge-source">'+plEsc(plSrcLabel(r.source))+'</span>' : '';

      // Обрезаем URL до читаемого вида если title — это URL
      const rawTitle = p.title || r.title || r.url;
      const displayTitle = rawTitle.startsWith('http') ? (p.company || r.source || rawTitle) : rawTitle;

      return '<div class="'+cardCls+'" data-url="'+plEsc(r.url)+'">'+
        '<div class="card-top-row">'+
          '<div class="card-avatar" style="background:'+color+'">'+plEsc(avatarLetter)+'</div>'+
          '<span class="card-company-name">'+plEsc(displayName || r.source || '—')+'</span>'+
          (p.priority ? '<span class="card-star">★</span>' : '')+
          (appliedDateStr ? '<span class="card-applied-date">'+plEsc(appliedDateStr)+'</span>' : '')+
        '</div>'+
        '<div class="card-spacer"></div>'+
        '<div class="card-title">'+plEsc(displayTitle)+'</div>'+
        '<div class="card-bottom-row">'+sourceBadge+statusBadge+'</div>'+
      '</div>';
    }).join('');

    // Attach click handlers
    grid.querySelectorAll('.job-card').forEach(card => {
      card.addEventListener('click', () => openDetail(card.dataset.url));
    });
  }

  window.renderTracker = renderTracker;

  window.goToTrackerRow = function(url) {
    setTimeout(() => {
      const card = document.querySelector('#cards-grid .job-card[data-url="'+CSS.escape(url)+'"]');
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('card-flash');
        setTimeout(() => card.classList.remove('card-flash'), 1800);
      }
    }, 80);
  };

  window.addEventListener('storage', e => { if (e.key === SK || e.key === PK) renderTracker(); });
  renderTracker();

  // Auto-refresh when call time passes
  setInterval(() => {
    const pl2 = plLs(PK);
    const hasUpcoming = Object.values(pl2).some(p => {
      if (p.callStatus || !p.callDate) return false;
      const dt   = new Date(p.callDate + 'T' + (p.callTime || '23:59') + ':00');
      const diff = Date.now() - dt.getTime();
      return diff > 0 && diff < 2 * 60 * 60 * 1000;
    });
    if (hasUpcoming) renderTracker();
  }, 60 * 1000);
})();

// ===== ADD VACANCY MODAL =====
(function() {
  const btn    = document.getElementById('addVacancyBtn');
  const modal  = document.getElementById('addModal');
  const cancel = document.getElementById('addModalCancel');
  const save   = document.getElementById('addModalSave');
  if (!btn || !modal) return;

  let fetchedData = null;

  function setStatus(msg, ok) {
    const el = document.getElementById('m-fetch-status');
    if (!el) return;
    el.textContent = msg;
    el.style.color = ok === true ? '#22c55e' : ok === false ? '#ff3b30' : '#8e8e93';
  }

  function sourceFromUrl(url) {
    try {
      const host = new URL(url).hostname.replace('www.', '');
      if (host.includes('linkedin'))  return 'LinkedIn';
      if (host.includes('hh.ru'))     return 'hh.ru';
      if (host.includes('habr'))      return 'Habr Career';
      if (host.includes('getmatch'))  return 'getmatch';
      if (host.includes('hirehi'))    return 'HireHi';
      if (host.includes('telegram'))  return 'Telegram';
      return host;
    } catch { return '' }
  }

  let fetchTimer = null;
  document.getElementById('m-url').addEventListener('input', function() {
    fetchedData = null;
    clearTimeout(fetchTimer);
    const url = this.value.trim();
    if (!url) { setStatus(''); return; }

    const hhMatch = url.match(/hh\.ru\/vacancy\/(\d+)/);
    if (hhMatch) {
      setStatus('⏳ Загружаю данные с hh.ru…');
      fetchTimer = setTimeout(async () => {
        try {
          const res = await fetch('https://api.hh.ru/vacancies/' + hhMatch[1]);
          if (res.status === 404) throw new Error('archived');
          if (!res.ok) throw new Error();
          const data = await res.json();
          fetchedData = {
            title:   data.name || '',
            company: data.employer?.name || '',
            source:  'hh.ru',
          };
          document.getElementById('m-manual-fields').style.display = 'none';
          setStatus('✓ ' + fetchedData.title + (fetchedData.company ? ' · ' + fetchedData.company : ''), true);
        } catch(err) {
          fetchedData = { title: '', company: '', source: 'hh.ru' };
          const msg = err.message === 'archived'
            ? 'Вакансия архивирована — введи название вручную'
            : 'Не удалось загрузить — введи название вручную';
          setStatus(msg, false);
          document.getElementById('m-manual-fields').style.display = 'block';
          setTimeout(() => document.getElementById('m-title').focus(), 50);
        }
      }, 600);
      return;
    }

    const src = sourceFromUrl(url);
    fetchedData = { title: '', company: '', source: src };
    setStatus(src ? 'Источник: ' + src : '');
  });

  function clearModal() {
    document.getElementById('m-url').value     = '';
    document.getElementById('m-note').value    = '';
    document.getElementById('m-title').value   = '';
    document.getElementById('m-company').value = '';
    document.getElementById('m-manual-fields').style.display = 'none';
    setStatus('');
    fetchedData = null;
  }

  function openModal() {
    modal.classList.add('open');
    setTimeout(() => document.getElementById('m-url').focus(), 100);
  }
  function closeModal() { modal.classList.remove('open'); }

  btn.addEventListener('click', openModal);
  cancel.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

  save.addEventListener('click', () => {
    const url  = document.getElementById('m-url').value.trim();
    const note = document.getElementById('m-note').value.trim();

    if (!url) { document.getElementById('m-url').focus(); setStatus('Вставь ссылку', false); return; }

    const key           = url;
    const manualTitle   = document.getElementById('m-title')?.value.trim() || '';
    const manualCompany = document.getElementById('m-company')?.value.trim() || '';
    const title         = fetchedData?.title   || manualTitle  || '';
    const company       = fetchedData?.company || manualCompany || '';
    const source        = fetchedData?.source  || sourceFromUrl(url);
    const today         = new Date().toISOString().slice(0,10);

    const PK = 'designJobs.pipeline.v1';
    let pl = {};
    try { pl = JSON.parse(localStorage.getItem(PK) || '{}'); } catch(e) {}
    pl[key] = {
      title:        title || url,
      source:       source || undefined,
      company:      company || undefined,
      note:         note || undefined,
      appliedDate:  today,
      addedAt:      today,
    };
    localStorage.setItem(PK, JSON.stringify(pl));
    clearModal();
    closeModal();
    if (typeof window.renderTracker === 'function') window.renderTracker();
    if (typeof window.goToTrackerRow === 'function') window.goToTrackerRow(key);
  });

  [document.getElementById('m-url'), document.getElementById('m-note')].forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') save.click(); });
  });

  const fab = document.getElementById('fabBtn');
  if (fab) fab.addEventListener('click', openModal);
})();

// ===== PWA SERVICE WORKER =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/tracker/sw.js').catch(() => {});
  });
}
