<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Generate icons</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<a id="dl192" download="icon-192.png">Скачать 192</a><br>
<a id="dl512" download="icon-512.png">Скачать 512</a>
<script>
function draw(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const r = s * 0.18;
  // Background
  ctx.fillStyle = '#5c6eff';
  roundRect(ctx, 0, 0, s, s, r);
  ctx.fill();
  // Letter T
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${s * 0.52}px -apple-system, system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Т', s / 2, s / 2 + s * 0.03);
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
['c192','c512'].forEach(id => draw(document.getElementById(id)));
document.getElementById('dl192').href = document.getElementById('c192').toDataURL('image/png');
document.getElementById('dl512').href = document.getElementById('c512').toDataURL('image/png');
</script>
</body>
</html>
